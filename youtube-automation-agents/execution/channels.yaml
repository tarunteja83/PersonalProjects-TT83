# =====================================================================
#  CHANNEL PAGE  -  who each channel is
#  Create the channel on YouTube yourself first, then list it here.
#  What and when each channel posts is answered in: execution/questions.yaml
#  Full rules: execution/execution.md
# =====================================================================
#
#  RULES
#    - The channel key (e.g. geopolitics_war) must be lowercase letters,
#      numbers and underscores, start with a letter, and be unique.
#      Use the SAME key in questions.yaml.
#    - Indent with spaces, never tabs.
#    - After any change run:  python execution/execution.py --check
# =====================================================================

channels:

  geopolitics_war:
    channel_name: "Frontline Ledger TT83"                            # REQUIRED: exactly as on YouTube
    channel_url: "https://www.youtube.com/@frontline-ledger-tt83"    # REQUIRED: channel link; uploads only go ahead if the YouTube login matches it
    made_for_kids: false                                             # REQUIRED: true | false  (true only for children under 13, legal COPPA setting)
    watermark_text: "@frontline-ledger-tt83"                         # optional: default is @ + channel name
    category_id: "25"                                                # optional: see category list below (default "24", or "27" for kids)

  kids_edu:
    channel_name: "WonderSprout Kids TT83"
    channel_url: "https://www.youtube.com/channel/UCf9u1ZaejKPPA-oOD8oXVfg"
    made_for_kids: true
    watermark_text: "WonderSprout Kids"
    mascot: "wondersprout"                 # superhero host in every video (kids channels only); leave out for none
    category_id: "27"

