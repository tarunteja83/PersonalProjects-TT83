name: Telegram Inbox (learn from shared videos and requests)

# Reads the posts in the Telegram alerts channel (agents/inbox.py): YouTube links to learn from or make videos
# like, "make a ... video about ..." requests, and approve / reject / cancel / queue replies. Adopted rules
# (execution/view_techniques.md) and queued requests (execution/video_requests.json) are committed to main, so
# the next daily run uses them. Telegram keeps unread posts for 24 hours; GitHub may start a scheduled run late.
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: telegram-inbox
  cancel-in-progress: false

jobs:
  inbox:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: youtube-automation-agents

    steps:
      - name: 1. Checkout Repository Code
        uses: actions/checkout@v7

      - name: 2. Set Up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: youtube-automation-agents/requirements.txt

      - name: 3. Install Python Dependencies
        run: pip install -r requirements.txt

      - name: 4. Handle Telegram Posts
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
        run: python execution/execution.py --inbox

      - name: 5. Save Adopted Rules and Queued Requests
        run: |
          if git diff --quiet -- execution/view_techniques.md execution/video_requests.json; then
            echo "Nothing to save."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add execution/view_techniques.md execution/video_requests.json
          git commit -m "Telegram inbox: learned rules and video requests"
          git pull --rebase origin main
          git push origin HEAD:main
